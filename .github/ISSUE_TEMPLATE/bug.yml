name: Bug report
description: Something is broken in Kinlore
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Do not include real family recordings or personal data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: git revision or package version
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
