name: Feature request
description: Suggest an idea for Kinlore
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What job is hard today? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Kinlore do instead? Keep it local-first.
    validations:
      required: true
  - type: dropdown
    id: roadmap
    attributes:
      label: Roadmap fit
      options:
        - Record and listen
        - Understand
        - Extend
        - Unsure
      default: 3
