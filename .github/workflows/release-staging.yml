name: release-staging

on:
  push:
    branches: [main]

concurrency:
  group: release-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  installers:
    name: installers
    uses: ./.github/workflows/package-installers.yml
    with:
      environment_name: staging

  publish:
    name: publish
    needs: installers
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish staging prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/publish-release.sh
          SHORT_SHA="$(git rev-parse --short HEAD)"
          TAG="staging-${SHORT_SHA}"
          printf '%s\n' "Unsigned staging build from \`${GITHUB_SHA}\` on main." "Installers: Linux AppImage, Windows NSIS, macOS DMG, and SHA256SUMS." > release-notes.md
          ./scripts/publish-release.sh --tag "$TAG" --title "Staging ${SHORT_SHA}" --notes release-notes.md --assets release-assets --prerelease
