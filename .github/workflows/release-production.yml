name: release-production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver to release (X.Y.Z). Must match package.json on main.
        required: true
        type: string

concurrency:
  group: release-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch and version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "release-production must run from main (got ${GITHUB_REF})"
            exit 1
          fi
          python3 - "$VERSION" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              print(f"version {version!r} is not X.Y.Z semver")
              sys.exit(1)

          def pkg_version(path: str) -> str:
              data = json.loads(Path(path).read_text(encoding="utf-8"))
              value = data.get("version")
              if not isinstance(value, str):
                  raise SystemExit(f"{path} version is missing or not a string")
              return value

          root = pkg_version("package.json")
          desktop = pkg_version("apps/desktop/package.json")
          if version != root or version != desktop:
              print(
                  f"version {version!r} does not match package.json "
                  f"(root={root!r}, apps/desktop={desktop!r})"
              )
              sys.exit(1)
          print(f"version {version} matches package.json")
          PY

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  installers:
    name: installers
    needs: [validate, ci]
    uses: ./.github/workflows/package-installers.yml
    with:
      environment_name: production

  publish:
    name: publish
    needs: installers
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Release notes
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish invalid tag ${TAG}"
            exit 1
          fi
          python3 - "$TAG" <<'PY'
          import re
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          version = tag[1:] if tag.startswith("v") else tag
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = text.splitlines()
          heading = re.compile(r"^##\s+\[?" + re.escape(version) + r"\]?")
          unreleased = re.compile(r"^##\s+\[Unreleased\]", re.I)

          def take_section(start: int) -> str:
              collected: list[str] = []
              for line in lines[start:]:
                  if line.startswith("## "):
                      break
                  collected.append(line)
              return "\n".join(collected).strip() + "\n"

          start = next((i for i, line in enumerate(lines) if heading.match(line)), None)
          if start is not None:
              body = take_section(start + 1)
          else:
              start = next((i for i, line in enumerate(lines) if unreleased.match(line)), None)
              if start is None:
                  body = text
              else:
                  body = (
                      f"Notes from CHANGELOG [Unreleased] for {tag}:\n\n"
                      + take_section(start + 1)
                  )
          body += "\nInstallers: Linux AppImage, Windows NSIS, macOS DMG, and SHA256SUMS.\n"
          Path("release-notes.md").write_text(body, encoding="utf-8")
          PY
      - name: Publish production release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          chmod +x scripts/publish-release.sh
          ./scripts/publish-release.sh --tag "v${VERSION}" --title "v${VERSION}" --notes release-notes.md --assets release-assets
